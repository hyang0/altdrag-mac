name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build universal binary
        run: ./build.sh

      - name: Verify architectures
        run: |
          lipo -info altdrag | grep -q arm64
          lipo -info altdrag | grep -q x86_64

      - name: Package
        run: zip "altdrag-${{ github.ref_name }}-macos-universal.zip" altdrag

      - name: Create release and upload binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "AltDrag ${{ github.ref_name }}" \
            --generate-notes \
            "altdrag-${{ github.ref_name }}-macos-universal.zip"
